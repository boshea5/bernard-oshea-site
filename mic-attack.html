<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIC ATTACK!</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#f4e8d3;font-family:Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif;color:#111}canvas{display:block;width:100vw;height:100vh;cursor:crosshair}.hud{position:fixed;inset:0;pointer-events:none}.title{position:absolute;top:18px;left:24px;font-size:clamp(30px,5vw,68px);letter-spacing:2px;transform:rotate(-2deg);text-shadow:4px 4px 0 #ff3b30}.score{position:absolute;top:25px;right:28px;text-align:right;font-size:26px}.help{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-family:Arial,sans-serif;font-weight:800;background:#111;color:#fff;padding:10px 16px;border-radius:99px;white-space:nowrap}.start{position:absolute;inset:0;display:grid;place-items:center;background:rgba(244,232,211,.72);pointer-events:auto}.card{text-align:center;background:#ffd83d;border:5px solid #111;padding:28px 38px;box-shadow:12px 12px 0 #111;transform:rotate(1deg);max-width:520px}.card h1{font-size:58px;margin:0 0 10px}.card p{font-family:Arial,sans-serif;font-weight:700;font-size:18px;line-height:1.4}.card button{font:inherit;font-size:26px;padding:10px 24px;background:#ff3b30;color:white;border:4px solid #111;box-shadow:5px 5px 0 #111;cursor:pointer}.flash{position:absolute;inset:0;background:#ff3b30;opacity:0;transition:opacity .08s}.gameover{display:none;position:absolute;inset:0;place-items:center;background:rgba(0,0,0,.75);pointer-events:auto;color:white;text-align:center}.gameover h2{font-size:70px;margin:0}.gameover button{font:inherit;font-size:25px;padding:10px 20px;cursor:pointer}
</style></head>
<body><canvas id="c"></canvas><div class="hud"><div class="title">MIC ATTACK!</div><div class="score">HITS <span id="hits">0</span><br>TIME <span id="time">45</span></div><div class="help">← ↑ ↓ → MOVE · SPACE = DODGE</div><div class="flash" id="flash"></div><div class="start" id="start"><div class="card"><h1>MIC ATTACK!</h1><p>You are the head. Tiny microphones are coming for you.<br><br>Use the <b>cursor keys</b> to move. Hit <b>SPACE</b> for a quick dodge. Survive 45 seconds.</p><button id="go">START</button></div></div><div class="gameover" id="over"><div><h2>GIG OVER</h2><p id="result" style="font:700 22px Arial"></p><button onclick="location.reload()">AGAIN!</button></div></div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,dpr,keys={},mics=[],particles=[],hits=0,time=45,running=false,last=0,spawn=0,dodge=0;
const player={x:0,y:0,r:62,vx:0,vy:0};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);if(!player.x){player.x=W/2;player.y=H/2}}addEventListener('resize',resize);resize();
addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key===' '&&dodge<=0)dodge=.22});addEventListener('keyup',e=>keys[e.key]=false);
function mic(){let side=Math.floor(Math.random()*4),px,py;if(side===0){px=-40;py=Math.random()*H}else if(side===1){px=W+40;py=Math.random()*H}else if(side===2){px=Math.random()*W;py=-40}else{px=Math.random()*W;py=H+40}let a=Math.atan2(player.y-py,player.x-px),s=230+Math.random()*150;mics.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,a:a,r:11})}
function drawMic(m){x.save();x.translate(m.x,m.y);x.rotate(m.a);x.fillStyle='#111';x.fillRect(-4,-5,30,10);x.fillStyle='#777';x.beginPath();x.ellipse(-7,0,11,8,0,0,Math.PI*2);x.fill();x.strokeStyle='#eee';x.lineWidth=2;for(let q=-11;q<=-3;q+=4){x.beginPath();x.moveTo(q,-6);x.lineTo(q,6);x.stroke()}x.fillStyle='#ff3b30';x.fillRect(18,-7,5,14);x.restore()}
function drawHead(){x.save();x.translate(player.x,player.y);if(dodge>0)x.rotate(Math.sin(performance.now()/30)*.08);x.fillStyle='#f2b37e';x.strokeStyle='#111';x.lineWidth=5;x.beginPath();x.ellipse(0,0,player.r*.82,player.r,0,0,Math.PI*2);x.fill();x.stroke();x.fillStyle='#432b1f';x.beginPath();x.arc(0,-43,48,Math.PI,Math.PI*2);x.fill();x.fillStyle='#111';x.beginPath();x.arc(-20,-7,4,0,7);x.arc(20,-7,4,0,7);x.fill();x.strokeStyle='#111';x.lineWidth=4;x.beginPath();x.arc(0,12,25,.2,Math.PI-.2);x.stroke();x.font='bold 14px Arial';x.textAlign='center';x.fillText('BERNARD',0,82);x.restore()}
function burst(px,py){for(let i=0;i<14;i++){let a=Math.random()*7,s=Math.random()*180;particles.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:.5})}}
function update(dt){let ax=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),ay=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0),speed=dodge>0?750:390;player.vx=ax*speed;player.vy=ay*speed;player.x=Math.max(60,Math.min(W-60,player.x+player.vx*dt));player.y=Math.max(90,Math.min(H-60,player.y+player.vy*dt));dodge-=dt;spawn-=dt;if(spawn<=0){mic();spawn=Math.max(.12,.55-(45-time)*.009)}for(let i=mics.length-1;i>=0;i--){let m=mics[i];m.x+=m.vx*dt;m.y+=m.vy*dt;let dx=m.x-player.x,dy=m.y-player.y;if(dx*dx+dy*dy<(player.r*.72+m.r)**2&&dodge<=0){hits++;document.getElementById('hits').textContent=hits;document.getElementById('flash').style.opacity=.45;setTimeout(()=>document.getElementById('flash').style.opacity=0,70);burst(m.x,m.y);mics.splice(i,1)}else if(m.x<-100||m.x>W+100||m.y<-100||m.y>H+100)mics.splice(i,1)}particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt});particles=particles.filter(p=>p.t>0)}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#f4e8d3';x.fillRect(0,0,W,H);x.strokeStyle='rgba(0,0,0,.06)';x.lineWidth=1;for(let i=0;i<W;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(let i=0;i<H;i+=40){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke()}mics.forEach(drawMic);particles.forEach(p=>{x.globalAlpha=p.t*2;x.fillStyle='#ff3b30';x.fillRect(p.x,p.y,6,6);x.globalAlpha=1});drawHead()}
function loop(t){if(!running)return;let dt=Math.min((t-last)/1000,.033);last=t;time-=dt;document.getElementById('time').textContent=Math.max(0,Math.ceil(time));update(dt);draw();if(time<=0){running=false;document.getElementById('over').style.display='grid';document.getElementById('result').textContent=`You took ${hits} microphone hits to the head.`;return}requestAnimationFrame(loop)}
document.getElementById('go').onclick=()=>{document.getElementById('start').style.display='none';running=true;last=performance.now();requestAnimationFrame(loop)};draw();
</script></body></html>
