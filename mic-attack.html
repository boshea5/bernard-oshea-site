<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIC ATTACK! | Bernard O'Shea</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#f4e8d3;font-family:Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif;color:#111}canvas{display:block;width:100vw;height:100vh;cursor:crosshair}.hud{position:fixed;inset:0;pointer-events:none}.back{position:absolute;left:24px;top:20px;z-index:10;pointer-events:auto;background:#111;color:#fff;text-decoration:none;padding:10px 14px;font:800 13px Arial;border-radius:999px}.title{position:absolute;top:64px;left:24px;font-size:clamp(30px,5vw,68px);letter-spacing:2px;transform:rotate(-2deg);text-shadow:4px 4px 0 #ff3b30}.score{position:absolute;top:25px;right:28px;text-align:right;font-size:24px}.help{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-family:Arial,sans-serif;font-weight:800;background:#111;color:#fff;padding:10px 16px;border-radius:99px;white-space:nowrap}.start{position:absolute;inset:0;display:grid;place-items:center;background:rgba(244,232,211,.82);pointer-events:auto}.card{text-align:center;background:#ffd83d;border:5px solid #111;padding:28px 38px;box-shadow:12px 12px 0 #111;transform:rotate(1deg);max-width:540px}.card h1{font-size:58px;margin:0 0 10px}.card p{font-family:Arial,sans-serif;font-weight:700;font-size:18px;line-height:1.4}.card button,.gameover button{font:inherit;font-size:26px;padding:10px 24px;background:#ff3b30;color:white;border:4px solid #111;box-shadow:5px 5px 0 #111;cursor:pointer}.flash{position:absolute;inset:0;background:#ff3b30;opacity:0;transition:opacity .08s}.gameover{display:none;position:absolute;inset:0;place-items:center;background:rgba(0,0,0,.78);pointer-events:auto;color:white;text-align:center}.gameover h2{font-size:70px;margin:0}.gameover .box{background:#111;padding:28px;border:4px solid #fff;box-shadow:12px 12px 0 #ff3b30}.gameover p{font:700 20px Arial;line-height:1.5}.newbest{color:#ffd83d;font-size:28px}.mute{position:absolute;right:24px;bottom:20px;pointer-events:auto;background:#fff;border:3px solid #111;border-radius:999px;padding:8px 12px;font:800 12px Arial;cursor:pointer}@media(max-width:650px){.title{top:72px;font-size:36px}.score{font-size:18px}.help{font-size:11px;bottom:64px}.card{margin:20px;padding:22px}.card h1{font-size:44px}}
</style></head>
<body><canvas id="c"></canvas><div class="hud"><a class="back" href="index.html">← BERNARDOSHEA.IE</a><div class="title">MIC ATTACK!</div><div class="score">HITS <span id="hits">0</span><br>BEST <span id="best">—</span><br>TIME <span id="time">45</span></div><div class="help">← ↑ ↓ → MOVE · SPACE = DODGE</div><button id="mute" class="mute">SOUND ON</button><div class="flash" id="flash"></div><div class="start" id="start"><div class="card"><h1>MIC ATTACK!</h1><p>Help Bernard survive a press scrum from hell.<br><br>Use the <b>cursor keys</b> to move his head. Hit <b>SPACE</b> for a quick dodge. Every microphone to the face counts against you.</p><button id="go">START GIG</button></div></div><div class="gameover" id="over"><div class="box"><h2>GIG OVER</h2><p id="result"></p><p id="bestmsg" class="newbest"></p><button id="again">AGAIN!</button></div></div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,dpr,keys={},mics=[],particles=[],hits=0,time=45,running=false,last=0,spawn=0,dodge=0,muted=false,audioCtx=null;
const player={x:0,y:0,r:68,vx:0,vy:0};const face=new Image();face.src='image.jpeg';
let best=localStorage.getItem('bernardMicAttackBest');document.getElementById('best').textContent=best===null?'—':best;
function audio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();return audioCtx}
function tone(freq,dur,type='square',vol=.08){if(muted)return;const a=audio(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur)}
function hitSound(){tone(105,.13,'sawtooth',.12);setTimeout(()=>tone(75,.12,'square',.07),45)}
function dodgeSound(){tone(410,.07,'sine',.05);setTimeout(()=>tone(620,.08,'sine',.04),40)}
function laugh(){if(muted)return;const a=audio();for(let i=0;i<5;i++){setTimeout(()=>{let o=a.createOscillator(),g=a.createGain();o.type='sawtooth';o.frequency.value=130+Math.random()*110;g.gain.setValueAtTime(.018,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.09);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.09)},i*85+Math.random()*40)}}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);if(!player.x){player.x=W/2;player.y=H/2}}addEventListener('resize',resize);resize();
addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key===' '&&dodge<=0){dodge=.22;dodgeSound()}});addEventListener('keyup',e=>keys[e.key]=false);
function mic(){let side=Math.floor(Math.random()*4),px,py;if(side===0){px=-40;py=Math.random()*H}else if(side===1){px=W+40;py=Math.random()*H}else if(side===2){px=Math.random()*W;py=-40}else{px=Math.random()*W;py=H+40}let a=Math.atan2(player.y-py,player.x-px),s=230+Math.random()*170;mics.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,a,r:11})}
function drawMic(m){x.save();x.translate(m.x,m.y);x.rotate(m.a);x.fillStyle='#111';x.fillRect(-4,-5,30,10);x.fillStyle='#777';x.beginPath();x.ellipse(-7,0,11,8,0,0,Math.PI*2);x.fill();x.strokeStyle='#eee';x.lineWidth=2;for(let q=-11;q<=-3;q+=4){x.beginPath();x.moveTo(q,-6);x.lineTo(q,6);x.stroke()}x.fillStyle='#ff3b30';x.fillRect(18,-7,5,14);x.restore()}
function drawHead(){x.save();x.translate(player.x,player.y);if(dodge>0)x.rotate(Math.sin(performance.now()/30)*.08);x.beginPath();x.arc(0,0,player.r,0,Math.PI*2);x.closePath();x.clip();if(face.complete&&face.naturalWidth){const s=Math.min(face.naturalWidth,face.naturalHeight),sx=(face.naturalWidth-s)/2,sy=Math.max(0,(face.naturalHeight-s)/2-s*.08);x.drawImage(face,sx,sy,s,s,-player.r,-player.r,player.r*2,player.r*2)}else{x.fillStyle='#f2b37e';x.fillRect(-player.r,-player.r,player.r*2,player.r*2)}x.restore();x.save();x.translate(player.x,player.y);x.strokeStyle='#111';x.lineWidth=6;x.beginPath();x.arc(0,0,player.r,0,Math.PI*2);x.stroke();x.restore()}
function burst(px,py){for(let i=0;i<14;i++){let a=Math.random()*7,s=Math.random()*180;particles.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:.5})}}
function update(dt){let ax=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),ay=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0),speed=dodge>0?760:390;player.vx=ax*speed;player.vy=ay*speed;player.x=Math.max(75,Math.min(W-75,player.x+player.vx*dt));player.y=Math.max(95,Math.min(H-75,player.y+player.vy*dt));dodge-=dt;spawn-=dt;if(spawn<=0){mic();spawn=Math.max(.12,.55-(45-time)*.009)}for(let i=mics.length-1;i>=0;i--){let m=mics[i];m.x+=m.vx*dt;m.y+=m.vy*dt;let dx=m.x-player.x,dy=m.y-player.y;if(dx*dx+dy*dy<(player.r*.72+m.r)**2&&dodge<=0){hits++;document.getElementById('hits').textContent=hits;document.getElementById('flash').style.opacity=.45;setTimeout(()=>document.getElementById('flash').style.opacity=0,70);hitSound();if(hits%3===0)laugh();burst(m.x,m.y);mics.splice(i,1)}else if(m.x<-100||m.x>W+100||m.y<-100||m.y>H+100)mics.splice(i,1)}particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt});particles=particles.filter(p=>p.t>0)}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#f4e8d3';x.fillRect(0,0,W,H);x.strokeStyle='rgba(0,0,0,.06)';x.lineWidth=1;for(let i=0;i<W;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(let i=0;i<H;i+=40){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke()}mics.forEach(drawMic);particles.forEach(p=>{x.globalAlpha=p.t*2;x.fillStyle='#ff3b30';x.fillRect(p.x,p.y,6,6);x.globalAlpha=1});drawHead()}
function finish(){running=false;let newBest=best===null||hits<Number(best);if(newBest){best=hits;localStorage.setItem('bernardMicAttackBest',hits);document.getElementById('best').textContent=hits;document.getElementById('bestmsg').textContent='NEW PERSONAL BEST!'}else document.getElementById('bestmsg').textContent=`Best score: ${best} hits`;document.getElementById('result').textContent=`Bernard took ${hits} microphone hit${hits===1?'':'s'} to the head.`;document.getElementById('over').style.display='grid';laugh()}
function loop(t){if(!running)return;let dt=Math.min((t-last)/1000,.033);last=t;time-=dt;document.getElementById('time').textContent=Math.max(0,Math.ceil(time));update(dt);draw();if(time<=0){finish();return}requestAnimationFrame(loop)}
document.getElementById('go').onclick=()=>{audio();document.getElementById('start').style.display='none';running=true;last=performance.now();requestAnimationFrame(loop)};document.getElementById('again').onclick=()=>location.reload();document.getElementById('mute').onclick=()=>{muted=!muted;document.getElementById('mute').textContent=muted?'SOUND OFF':'SOUND ON'};face.onload=draw;draw();
</script></body></html>
